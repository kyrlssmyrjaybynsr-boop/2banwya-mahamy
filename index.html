<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff8c42">
    <title>جدول مذاكرة للصف الثاني بكلوريا</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <div class="container">
        <h1>جدول مذاكرة للصف الثاني بكلوريا</h1>
        <h2>مسار الهندسه وعلوم الحاسب</h2>

        <div class="tools">
            <div class="tool-box">
                <h3>⏱️ ساعة ايقاف</h3>
                <div id="stopwatch">00:00:00</div>
                <button id="swStart">ابدأ</button>
                <button id="swReset">تصفير</button>
            </div>

            <div class="tool-box">
                <h3>⏰ عداد قابل للتعديل</h3>
                <input type="number" id="timerInput" value="60" min="1"> دقيقة
                <div id="timer">60:00</div>
                <button id="timerStart">ابدأ</button>
                <button id="timerReset">اعادة</button>
            </div>
        </div>

        <div class="calendar-box">
            <h3>📅 التقويم والملاحظات</h3>
            <input type="date" id="datePicker">
            <textarea id="notes" rows="4" placeholder="اكتب ملاحظات اليوم هنا..."></textarea>
            <button id="saveNoteBtn">حفظ الملاحظة</button>
        </div>

        <div class="week-table-box">
            <h3>📖 جدول الاسبوع بالفترات</h3>
            <input type="text" id="weekName" placeholder="اسم الاسبوع: مثال الاسبوع الاول">
            <table id="weekTable">
                <thead>
                    <tr>
                        <th>اليوم</th>
                        <th>الصباحية<br>7ص - 12ظ</th>
                        <th>العصرية<br>2ظ - 6م</th>
                        <th>المسائية<br>8م - 11م</th>
                    </tr>
                </thead>
                <tbody id="weekBody"></tbody>
            </table>
        </div>

        <h3>📚 المواد</h3>
        <div id="subjectsList"></div>
    </div>

    <audio id="alarmSound" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>
    <script src="script.js"></script> 
</body>
</html>
